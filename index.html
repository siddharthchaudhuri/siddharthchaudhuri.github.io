<!DOCTYPE html>
<html>
<head>
  <title>Siddharth | Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');

    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    a {
      text-decoration: none;
      color: white;
    }

    a:visited {
      color: white;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: clamp(48px, 8vw, 120px);
      font-weight: 900;
      margin: 0;
    }

    .subtitle {
      color: #aaa;
      margin-top: 20px;
    }

    .section {
      padding: 80px 40px;
      position: relative;
      z-index: 2;
    }

    .title {
      text-align: center;
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .group-label {
      text-align: center;
      font-size: 12px;
      letter-spacing: 2px;
      color: #777;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      max-width: 1200px;
      margin: auto;
    }

    /* CARD */
    .card {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      transition: 0.4s;
    }

    .card:hover img {
      transform: scale(1.05);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    }

    .card-title {
      font-weight: 800;
      font-size: 18px;
    }

    .card-desc {
      font-size: 14px;
      color: #ccc;
      opacity: 0;
      transform: translateY(10px);
      transition: 0.3s;
    }

    .card:hover .card-desc {
      opacity: 1;
      transform: translateY(0);
    }

    /* MODAL */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-box {
      background: #111;
      border-radius: 12px;
      width: 90%;
      max-width: 600px;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      gap: 16px;
      padding: 20px;
      border-bottom: 1px solid #222;
    }

    .modal-header img {
      width: 120px;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
    }

    .modal-title {
      font-weight: 700;
    }

    .modal-desc {
      color: #aaa;
      font-size: 14px;
    }

    .modal-links {
      padding: 20px;
    }

    .link {
      display: flex;
      justify-content: space-between;
      padding: 14px;
      margin-bottom: 10px;
      background: #1a1a1a;
      border-radius: 8px;
    }

    .link:hover {
      background: #2a2a2a;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      cursor: pointer;
      font-size: 20px;
      color: #aaa;
    }

  </style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="hero">
  <h1>SIDDHARTH CHAUDHURI</h1>
  <div class="subtitle">
    Copywriter, Campaign Creator, AI Enthusiast, Idea Factory.
  </div>
</div>

<div class="section">
  <div class="title">My Work</div>
  <div class="group-label">CREATIVITY ZONE</div>

  <div class="grid">

    <div class="card" onclick="openModal('specAds')">
      <img src="https://images.unsplash.com/photo-1580907826414-5345a5aa68ad?q=80&w=1074&auto=format&fit=crop">
      <div class="overlay">
        <div class="card-title">Spec Ads</div>
        <div class="card-desc">Would've Could've Should've</div>
      </div>
    </div>

    <div class="card" onclick="openModal('brand')">
      <img src="https://images.unsplash.com/photo-1549281899-f75600a24107?q=80&w=1171&auto=format&fit=crop">
      <div class="overlay">
        <div class="card-title">Brand Pitches</div>
        <div class="card-desc">Campaign-ready creativity</div>
      </div>
    </div>

  </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="close" onclick="closeModal()">✕</div>
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
function openModal(type) {
  const modal = document.getElementById("modal");
  const box = document.getElementById("modalBox");

  if (type === "brand") {
    box.innerHTML = `
      <div class="modal-header">
        <img src="https://images.unsplash.com/photo-1549281899-f75600a24107?q=80&w=1171&auto=format&fit=crop">
        <div>
          <div class="modal-title">Brand Pitches</div>
          <div class="modal-desc">Campaign-ready creativity</div>
        </div>
      </div>

      <div class="modal-links">
        <a class="link" href="https://docs.google.com/presentation/d/1wmT9WiZ8lD6SsX0PZKAoiy7hvcKYXyiU/edit" target="_blank">Bobakat Pitch →</a>
        <a class="link" href="https://docs.google.com/presentation/d/1TDQfuX41TiGsqTE-CgpwKZTZKHwMeFz-d5djOjakjF8/edit?usp=sharing" target="_blank">Apsara Pitch →</a>
      </div>
    `;
  }

  modal.style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

/* STARS */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let particles = Array.from({length: 150}, () => ({
  x: Math.random()*canvas.width,
  y: Math.random()*canvas.height,
  size: Math.random()*2,
  vx: (Math.random()-0.5)*0.2,
  vy: (Math.random()-0.5)*0.2
}));

function animate() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0)p.x=canvas.width;
    if(p.x>canvas.width)p.x=0;
    if(p.y<0)p.y=canvas.height;
    if(p.y>canvas.height)p.y=0;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();
  });
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
