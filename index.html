<!DOCTYPE html>
<html>
<head>
  <title>Siddharth | Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');

    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 3;
      flex-direction: column;
    }

    h1 {
      font-size: clamp(48px, 8vw, 120px);
      margin: 0;
      font-weight: 900;
      letter-spacing: -2px;
    }

    p {
      margin-top: 20px;
      color: #a1a1aa;
      font-size: 20px;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* ROCKET */
    .rocket {
      position: absolute;
      top: 18%;
      left: 12%;
      width: 40px;
      height: 80px;
      background: white;
      border-radius: 20px 20px 10px 10px;
      z-index: 2;
      animation: float 4s ease-in-out infinite;
    }

    /* ROCKET TIP */
    .rocket::before {
      content: "";
      position: absolute;
      top: -15px;
      left: 0;
      width: 40px;
      height: 20px;
      background: white;
      border-radius: 50%;
    }

    /* ASTRONAUT */
    .astronaut {
      position: absolute;
      top: 30%;
      left: 22%;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      z-index: 2;
      animation: float 5s ease-in-out infinite;
    }

    /* BODY */
    .astronaut::after {
      content: "";
      position: absolute;
      top: 20px;
      left: -5px;
      width: 30px;
      height: 20px;
      background: white;
      border-radius: 10px;
    }

    /* TETHER */
    .tether {
      position: absolute;
      top: 24%;
      left: 14%;
      width: 100px;
      height: 1px;
      background: white;
      transform: rotate(25deg);
      opacity: 0.5;
      z-index: 2;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }

  </style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="rocket"></div>
<div class="astronaut"></div>
<div class="tether"></div>

<div class="hero">
  <h1>SIDDHARTH CHAUDHURI</h1>
  <p>Copywriter, Campaign Creator, Social Media Marketer, Idea Factory.</p>
</div>

<script>
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  resize();
  window.addEventListener("resize", resize);

  let particles = [];

  function init() {
    particles = [];
    for (let i = 0; i < 120; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.5,
        speedX: (Math.random() - 0.5) * 0.3,
        speedY: (Math.random() - 0.5) * 0.3
      });
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
      p.x += p.speedX;
      p.y += p.speedY;

      if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
      if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;

      ctx.fillStyle = "white";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });

    requestAnimationFrame(animate);
  }

  init();
  animate();
</script>

</body>
</html>
