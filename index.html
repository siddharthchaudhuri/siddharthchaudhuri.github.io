<!DOCTYPE html>
<html>
<head>
  <title>Siddharth | Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');

    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: clamp(48px, 8vw, 120px);
      font-weight: 900;
      margin: 0;
    }

    .subtitle {
      color: #aaa;
      margin-top: 20px;
    }

    .section {
      padding: 80px 40px;
      position: relative;
      z-index: 2;
    }

    .title {
      text-align: center;
      font-size: 40px;
      font-weight: 900;
    }

    .group-label {
      text-align: center;
      font-size: 12px;
      color: #777;
      margin: 10px 0 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      max-width: 1400px;
      margin: auto;
    }

    .card {
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      transition: 0.4s;
    }

    .card:hover img {
      transform: scale(1.05);
    }

    .overlay {
      position: absolute;
      inset: 0;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    }

    .card-title {
      font-weight: 800;
    }

    .card-desc {
      font-size: 13px;
      color: #ccc;
      opacity: 0;
      transform: translateY(10px);
      transition: 0.3s;
    }

    .card:hover .card-desc {
      opacity: 1;
      transform: translateY(0);
    }

    /* MODAL */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-box {
      background: #111;
      width: 90%;
      max-width: 650px;
      border-radius: 12px;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      gap: 16px;
      padding: 20px;
      border-bottom: 1px solid #222;
    }

    .modal-header img {
      width: 140px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
    }

    .modal-links {
      padding: 20px;
    }

    .link {
      display: flex;
      justify-content: space-between;
      padding: 14px;
      margin-bottom: 10px;
      background: #1a1a1a;
      border-radius: 8px;
      text-decoration: none;
      color: white;
    }

    .link:hover {
      background: #2a2a2a;
    }

  </style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="hero">
  <h1>SIDDHARTH CHAUDHURI</h1>
  <div class="subtitle">
    Copywriter, Campaign Creator, AI Enthusiast, Idea Factory.
  </div>
</div>

<div class="section">
  <div class="title">My Work</div>
  <div class="group-label">CREATIVITY ZONE</div>

  <div class="grid">

    <div class="card" onclick="openModal('Spec Ads')">
      <img src="https://images.unsplash.com/photo-1580907826414-5345a5aa68ad?q=80&w=1074">
      <div class="overlay">
        <div class="card-title">Spec Ads</div>
        <div class="card-desc">Would've Could've Should've</div>
      </div>
    </div>

    <div class="card" onclick="openModal('Brand Pitches')">
      <img src="https://images.unsplash.com/photo-1549281899-f75600a24107?q=80&w=1171">
      <div class="overlay">
        <div class="card-title">Brand Pitches</div>
        <div class="card-desc">Campaign-ready creativity</div>
      </div>
    </div>

    <div class="card" onclick="openModal('Social Media')">
      <img src="https://images.unsplash.com/photo-1553532435-93d532a45f15?q=80&w=1974">
      <div class="overlay">
        <div class="card-title">Social Media Campaigns</div>
        <div class="card-desc">Scroll-stopping ideas</div>
      </div>
    </div>

    <div class="card" onclick="openModal('OOH')">
      <img src="https://images.unsplash.com/photo-1513757378314-e46255f6ed16?q=80&w=2070">
      <div class="overlay">
        <div class="card-title">OOH Promotion</div>
        <div class="card-desc">Making streets speak</div>
      </div>
    </div>

  </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="if(event.target.id==='modal')closeModal()">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>

/* REAL DATA */
const data = {
  "Spec Ads": {
    desc: "Would've Could've Should've",
    img: "https://images.unsplash.com/photo-1580907826414-5345a5aa68ad?q=80&w=1074",
    items: [
      {title:"KFC | English", url:"https://docs.google.com/presentation/d/1TkJzWFiDSZduiwr3WXeuj_yAXJZtJxYgHU42grRExqI/edit?usp=sharing"},
      {title:"Olly | English", url:"https://docs.google.com/presentation/d/16x3HOnKIveE58Q9ZbIfTcsfx3tBBBOJkAvLMkrJ5siI/edit?usp=sharing"},
      {title:"Casper | English", url:"https://docs.google.com/presentation/d/1crgikIbC654uu3lt7T_iRd4a0NzFRAmNOu5PUzejw2M/edit?usp=sharing"}
    ]
  },

  "Brand Pitches": {
    desc: "Campaign-ready creativity",
    img: "https://images.unsplash.com/photo-1549281899-f75600a24107?q=80&w=1171",
    items: [
      {title:"Bobakat Pitch", url:"https://docs.google.com/presentation/d/1wmT9WiZ8lD6SsX0PZKAoiy7hvcKYXyiU/edit"},
      {title:"Apsara Ice Cream Pitch", url:"https://docs.google.com/presentation/d/1TDQfuX41TiGsqTE-CgpwKZTZKHwMeFz-d5djOjakjF8/edit"},
      {title:"Tribe Pitch", url:"https://docs.google.com/presentation/d/1VzPZtLMSkiCoS4hv1BNO2NztnfvVyu5NAQ9DLlYxcWI/edit"},
      {title:"KDM Pitch", url:"https://docs.google.com/presentation/d/1aeF9DVbnmBoZU3MCvSZzWHF7rFYTkslkG4lXYZuwqR4/edit"}
    ]
  },

  "Social Media": {
    desc: "Scroll-stopping ideas",
    img: "https://images.unsplash.com/photo-1553532435-93d532a45f15?q=80&w=1974",
    items: [
      {title:"CG Campaign", url:"https://docs.google.com/presentation/d/1hpN0wRj3HFa3JQN8mgGYw890vykHbWmhOCOnyRbtKcI/edit"},
      {title:"Bobakat Campaign", url:"https://docs.google.com/presentation/d/1M3NuDMqUNMQvFfp14LT65TLzXwowFORQnr7MbxGww7U/edit"}
    ]
  },

  "OOH": {
    desc: "Making streets speak",
    img: "https://images.unsplash.com/photo-1513757378314-e46255f6ed16?q=80&w=2070",
    items: [
      {title:"Apsara Ice Creams", url:"https://docs.google.com/presentation/d/1BbgWdJdM9dMpXreFV4-qy_qLkoRPp5KqEABpukBcZPw/edit"}
    ]
  }
};

/* MODAL */
function openModal(name){
  const d = data[name];
  const box = document.getElementById("modalBox");

  box.innerHTML = `
    <div class="modal-header">
      <img src="${d.img}">
      <div>
        <h3>${name}</h3>
        <p style="color:#aaa">${d.desc}</p>
      </div>
    </div>

    <div class="modal-links">
      ${d.items.map(i => `
        <a href="${i.url}" target="_blank" class="link">
          ${i.title} <span>→</span>
        </a>
      `).join("")}
    </div>
  `;

  document.getElementById("modal").style.display = "flex";
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}

/* STARS */
const c=document.getElementById("bg");
const ctx=c.getContext("2d");

function resize(){
  c.width=innerWidth;
  c.height=innerHeight;
}
resize();
window.onresize=resize;

let p=Array.from({length:150},()=>({
  x:Math.random()*c.width,
  y:Math.random()*c.height,
  vx:(Math.random()-0.5)*0.24,
  vy:(Math.random()-0.5)*0.24,
  s:Math.random()*2
}));

function a(){
  ctx.clearRect(0,0,c.width,c.height);
  p.forEach(e=>{
    e.x+=e.vx; e.y+=e.vy;
    if(e.x<0)e.x=c.width;
    if(e.x>c.width)e.x=0;
    if(e.y<0)e.y=c.height;
    if(e.y>c.height)e.y=0;
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.s,0,6.28);
    ctx.fillStyle="white";
    ctx.fill();
  });
  requestAnimationFrame(a);
}
a();

</script>

</body>
</html>
