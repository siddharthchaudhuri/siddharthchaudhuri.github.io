<!DOCTYPE html>
<html>
<head>
  <title>Siddharth | Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');

    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 2;
      flex-direction: column;
      padding: 20px;
    }

    h1 {
      font-size: clamp(48px, 8vw, 120px);
      margin: 0;
      font-weight: 900;
    }

    p {
      margin-top: 20px;
      color: #aaa;
      font-size: 20px;
    }

    .section {
      padding: 80px 20px;
      max-width: 1000px;
      margin: auto;
      position: relative;
      z-index: 2;
    }

    .group-title {
      text-align: center;
      font-size: 14px;
      letter-spacing: 2px;
      color: #777;
      margin-bottom: 40px;
    }

    .card {
      border: 1px solid #222;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      background: #111;
    }

    .card h3 {
      margin: 0 0 10px 0;
    }

    a {
      display: block;
      color: white;
      text-decoration: none;
      margin: 5px 0;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 6px;
    }

    a:hover {
      background: #222;
    }

  </style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="hero">
  <h1>SIDDHARTH CHAUDHURI</h1>
  <p>Copywriter, Campaign Creator, AI Enthusiast, Idea Factory.</p>
</div>

<div class="section">
  <div class="group-title">Creativity Zone</div>

  <div class="card">
    <h3>Spec Ads</h3>
    <a href="https://docs.google.com/presentation/d/1TkJzWFiDSZduiwr3WXeuj_yAXJZtJxYgHU42grRExqI/edit?usp=sharing" target="_blank">KFC | English</a>
    <a href="https://docs.google.com/presentation/d/16x3HOnKIveE58Q9ZbIfTcsfx3tBBBOJkAvLMkrJ5siI/edit?usp=sharing" target="_blank">Olly | English</a>
    <a href="https://docs.google.com/presentation/d/1crgikIbC654uu3lt7T_iRd4a0NzFRAmNOu5PUzejw2M/edit?usp=sharing" target="_blank">Casper | English</a>
  </div>

  <div class="card">
    <h3>Brand Pitches</h3>
    <a href="https://docs.google.com/presentation/d/1wmT9WiZ8lD6SsX0PZKAoiy7hvcKYXyiU/edit" target="_blank">Bobakat Pitch</a>
    <a href="https://docs.google.com/presentation/d/1TDQfuX41TiGsqTE-CgpwKZTZKHwMeFz-d5djOjakjF8/edit?usp=sharing" target="_blank">Apsara Ice Cream</a>
  </div>

</div>

<script>
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  resize();
  window.addEventListener("resize", resize);

  let particles = [];

  function init() {
    particles = [];
    for (let i = 0; i < 150; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        speedX: (Math.random() - 0.5) * 0.2,
        speedY: (Math.random() - 0.5) * 0.2
      });
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
      p.x += p.speedX;
      p.y += p.speedY;

      if (p.x < 0) p.x = canvas.width;
      if (p.x > canvas.width) p.x = 0;
      if (p.y < 0) p.y = canvas.height;
      if (p.y > canvas.height) p.y = 0;

      ctx.fillStyle = "white";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });

    requestAnimationFrame(animate);
  }

  init();
  animate();
</script>

</body>
</html>
