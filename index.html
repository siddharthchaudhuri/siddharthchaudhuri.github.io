<!DOCTYPE html>
<html>
<head>
  <title>Siddharth | Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');

    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 2;
      flex-direction: column;
    }

    h1 {
      font-size: clamp(48px, 8vw, 120px);
      margin: 0;
      font-weight: 900;
    }

    p {
      margin-top: 20px;
      color: #aaa;
    }

    .section {
      padding: 80px 40px;
      position: relative;
      z-index: 2;
    }

    .title {
      text-align: center;
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      font-size: 12px;
      letter-spacing: 2px;
      color: #777;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      max-width: 1200px;
      margin: auto;
    }

    .card {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      transition: 0.4s;
    }

    .card:hover img {
      transform: scale(1.05);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      display: flex;
      align-items: flex-end;
      padding: 20px;
      font-weight: bold;
    }

    .card:hover .overlay {
      background: rgba(0,0,0,0.6);
    }

  </style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="hero">
  <h1>SIDDHARTH CHAUDHURI</h1>
  <p>Copywriter, Campaign Creator, AI Enthusiast, Idea Factory.</p>
</div>

<!-- MY WORK -->
<div class="section">
  <div class="title">My Work</div>

  <div class="subtitle">CREATIVITY ZONE</div>

  <div class="grid">

    <a href="https://docs.google.com/presentation/d/1TkJzWFiDSZduiwr3WXeuj_yAXJZtJxYgHU42grRExqI/edit?usp=sharing" target="_blank" class="card">
      <img src="https://images.unsplash.com/photo-1580907826414-5345a5aa68ad?q=80&w=1074&auto=format&fit=crop">
      <div class="overlay">Spec Ads</div>
    </a>

    <a href="https://docs.google.com/presentation/d/1wmT9WiZ8lD6SsX0PZKAoiy7hvcKYXyiU/edit" target="_blank" class="card">
      <img src="https://images.unsplash.com/photo-1549281899-f75600a24107?q=80&w=1171&auto=format&fit=crop">
      <div class="overlay">Brand Pitches</div>
    </a>

    <a href="https://docs.google.com/presentation/d/1hpN0wRj3HFa3JQN8mgGYw890vykHbWmhOCOnyRbtKcI/edit?usp=sharing" target="_blank" class="card">
      <img src="https://images.unsplash.com/photo-1553532435-93d532a45f15?q=80&w=1974&auto=format&fit=crop">
      <div class="overlay">Social Media Campaigns & Creatives</div>
    </a>

    <a href="https://docs.google.com/presentation/d/1BbgWdJdM9dMpXreFV4-qy_qLkoRPp5KqEABpukBcZPw/edit?usp=sharing" target="_blank" class="card">
      <img src="https://images.unsplash.com/photo-1513757378314-e46255f6ed16?q=80&w=2070&auto=format&fit=crop">
      <div class="overlay">Out Of House (OOH) Promotion</div>
    </a>

    <a href="https://drive.google.com/file/d/1mV_qdKqieWIJA_YgZMv5E7xMUddjkMWc/view" target="_blank" class="card">
      <img src="https://images.unsplash.com/photo-1577190651915-bf62d54d5b36?q=80&w=2069&auto=format&fit=crop">
      <div class="overlay">Professional Videos</div>
    </a>

  </div>
</div>

<script>
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  resize();
  window.addEventListener("resize", resize);

  let particles = [];

  function init() {
    particles = [];
    for (let i = 0; i < 150; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        speedX: (Math.random() - 0.5) * 0.2,
        speedY: (Math.random() - 0.5) * 0.2
      });
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
      p.x += p.speedX;
      p.y += p.speedY;

      if (p.x < 0) p.x = canvas.width;
      if (p.x > canvas.width) p.x = 0;
      if (p.y < 0) p.y = canvas.height;
      if (p.y > canvas.height) p.y = 0;

      ctx.fillStyle = "white";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });

    requestAnimationFrame(animate);
  }

  init();
  animate();
</script>

</body>
</html>
