<!DOCTYPE html>
<html>
<head>
  <title>Siddharth | Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');

    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 2;
      position: relative;
    }

    h1 {
      font-size: clamp(48px, 8vw, 120px);
      font-weight: 900;
      margin: 0;
    }

    .subtitle {
      color: #aaa;
      margin-top: 20px;
    }

    .section {
      padding: 80px 40px;
      position: relative;
      z-index: 2;
    }

    .title {
      text-align: center;
      font-size: 40px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .group-label {
      text-align: center;
      font-size: 12px;
      color: #777;
      margin-bottom: 40px;
    }

    /* 🔥 FIXED GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      max-width: 1400px;
      margin: auto;
    }

    .card {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      transition: 0.4s;
    }

    .card:hover img {
      transform: scale(1.05);
    }

    .overlay {
      position: absolute;
      inset: 0;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    }

    .card-title {
      font-weight: 800;
      font-size: 16px;
    }

    .card-desc {
      font-size: 13px;
      color: #ccc;
      opacity: 0;
      transform: translateY(10px);
      transition: 0.3s;
    }

    .card:hover .card-desc {
      opacity: 1;
      transform: translateY(0);
    }

    /* MODAL */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-box {
      background: #111;
      width: 90%;
      max-width: 650px;
      border-radius: 12px;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      gap: 16px;
      padding: 20px;
      border-bottom: 1px solid #222;
    }

    .modal-header img {
      width: 140px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
    }

    .modal-links {
      padding: 20px;
    }

    .link {
      display: flex;
      justify-content: space-between;
      padding: 14px;
      margin-bottom: 10px;
      background: #1a1a1a;
      border-radius: 8px;
    }

    .link:hover {
      background: #2a2a2a;
    }

  </style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="hero">
  <h1>SIDDHARTH CHAUDHURI</h1>
  <div class="subtitle">
    Copywriter, Campaign Creator, AI Enthusiast, Idea Factory.
  </div>
</div>

<div class="section">
  <div class="title">My Work</div>
  <div class="group-label">CREATIVITY ZONE</div>

  <div class="grid">

    <div class="card" onclick="openModal('Spec Ads','Would\'ve Could\'ve Should\'ve','https://images.unsplash.com/photo-1580907826414-5345a5aa68ad?q=80&w=1074',[
      'KFC | English','Olly | English','Casper | English'
    ])">
      <img src="https://images.unsplash.com/photo-1580907826414-5345a5aa68ad?q=80&w=1074">
      <div class="overlay">
        <div class="card-title">Spec Ads</div>
        <div class="card-desc">Would've Could've Should've</div>
      </div>
    </div>

    <div class="card" onclick="openModal('Brand Pitches','Campaign-ready creativity','https://images.unsplash.com/photo-1549281899-f75600a24107?q=80&w=1171',[
      'Bobakat Pitch','Apsara Pitch','Tribe Pitch','KDM Pitch'
    ])">
      <img src="https://images.unsplash.com/photo-1549281899-f75600a24107?q=80&w=1171">
      <div class="overlay">
        <div class="card-title">Brand Pitches</div>
        <div class="card-desc">Campaign-ready creativity</div>
      </div>
    </div>

    <div class="card" onclick="openModal('Social Media','Scroll-stopping ideas','https://images.unsplash.com/photo-1553532435-93d532a45f15?q=80&w=1974',[
      'Campaign 1','Campaign 2','Campaign 3'
    ])">
      <img src="https://images.unsplash.com/photo-1553532435-93d532a45f15?q=80&w=1974">
      <div class="overlay">
        <div class="card-title">Social Media Campaigns</div>
        <div class="card-desc">Scroll-stopping ideas</div>
      </div>
    </div>

    <div class="card" onclick="openModal('OOH','Making streets speak','https://images.unsplash.com/photo-1513757378314-e46255f6ed16?q=80&w=2070',[
      'Billboard 1','Billboard 2'
    ])">
      <img src="https://images.unsplash.com/photo-1513757378314-e46255f6ed16?q=80&w=2070">
      <div class="overlay">
        <div class="card-title">OOH Promotion</div>
        <div class="card-desc">Making streets speak</div>
      </div>
    </div>

  </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="if(event.target.id==='modal')closeModal()">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>

/* MODAL */
function openModal(title, desc, img, items) {
  const modal = document.getElementById("modal");
  const box = document.getElementById("modalBox");

  box.innerHTML = `
    <div class="modal-header">
      <img src="${img}">
      <div>
        <h3>${title}</h3>
        <p style="color:#aaa">${desc}</p>
      </div>
    </div>
    <div class="modal-links">
      ${items.map(i=>`<div class="link">${i} <span>→</span></div>`).join("")}
    </div>
  `;

  modal.style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

/* STARS */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let particles = Array.from({length:150},()=>({
  x:Math.random()*canvas.width,
  y:Math.random()*canvas.height,
  size:Math.random()*2,
  vx:(Math.random()-0.5)*0.24,
  vy:(Math.random()-0.5)*0.24
}));

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0)p.x=canvas.width;
    if(p.x>canvas.width)p.x=0;
    if(p.y<0)p.y=canvas.height;
    if(p.y>canvas.height)p.y=0;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();
  });
  requestAnimationFrame(animate);
}
animate();

</script>

</body>
</html>
